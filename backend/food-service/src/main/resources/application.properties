spring.application.name=food-service

# Server configuration
server.port=8086

# H2 Database configuration (food_db)
spring.datasource.url=jdbc:h2:mem:food_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# JPA/Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Keycloak Security Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/nexora
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/nexora/protocol/openid-connect/certs

# Custom properties for security converter
jwt.auth.converter.resource-id=nexora-client
jwt.auth.converter.principal-attribute=preferred_username

# Enable detailed security logging for development
logging.level.org.springframework.security=DEBUG
