spring.application.name=ai-service

# Server configuration
server.port=8085

# PostgreSQL Database configuration (ai_db)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_db}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nexora}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nexora_password}

# JPA/Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Keycloak Security Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/nexora}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/nexora/protocol/openid-connect/certs}

# Custom properties for security converter
jwt.auth.converter.resource-id=nexora-client
jwt.auth.converter.principal-attribute=preferred_username

# Enable detailed security logging for development
logging.level.org.springframework.security=DEBUG

# Groq API Configuration
groq.api.key=${GROQ_API_KEY:}
groq.model=llama-3.3-70b-versatile
groq.api.url=https://api.groq.com/openai/v1/chat/completions

# Import local override configuration (ignored by git)
spring.config.import=optional:classpath:application-local.properties
