spring:
  application:
    name: api-gateway

  # ── Security / OAuth2 ─────────────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak issuer URI (port 8081 per docker-compose.yml)
          issuer-uri: http://localhost:8081/realms/nexora
          jwk-set-uri: http://localhost:8081/realms/nexora/protocol/openid-connect/certs

  # ── Cloud Gateway ─────────────────────────────────────────────────────────
  cloud:
    gateway:
      # Global CORS handled by SecurityConfig; disable gateway-level duplicate
      globalcors:
        add-to-simple-url-handler-mapping: false

      # Default filters applied to every route
      default-filters:
        # Preserve the original Host header
        - PreserveHostHeader
        - DedupeResponseHeader=Access-Control-Allow-Origin, Access-Control-Allow-Credentials, RETAIN_FIRST

      # Downstream HTTP client timeouts
      httpclient:
        connect-timeout: 5000   # 5 s to establish connection to downstream
        response-timeout: 30s   # 30 s to receive complete response

# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: 8080

# ── Actuator ──────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  # Only include components that are always expected to be present
  health:
    defaults:
      enabled: true

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO
    com.nexora.gateway: DEBUG
    reactor.netty: INFO
