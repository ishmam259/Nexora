spring:
  application:
    name: api-gateway

  codec:
    # Allow marketplace photo uploads through the gateway
    max-in-memory-size: 10MB

  # ── Security / OAuth2 ─────────────────────────────────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/nexora}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/nexora/protocol/openid-connect/certs}

  # ── Cloud Gateway ─────────────────────────────────────────────────────────
  cloud:
    gateway:
      # Global CORS handled by SecurityConfig; disable gateway-level duplicate
      globalcors:
        add-to-simple-url-handler-mapping: false

      # Default filters applied to every route
      default-filters:
        # Preserve the original Host header
        - PreserveHostHeader
        - DedupeResponseHeader=Access-Control-Allow-Origin, Access-Control-Allow-Credentials, RETAIN_FIRST

      # Downstream HTTP client timeouts
      httpclient:
        connect-timeout: 5000   # 5 s to establish connection to downstream
        response-timeout: 30s   # 30 s to receive complete response

# ── Downstream service URIs (override in Docker via NEXORA_SERVICE_*_URI) ─────
nexora:
  gateway:
    services:
      marketplace: ${NEXORA_SERVICE_MARKETPLACE_URI:http://localhost:8082}
      payment: ${NEXORA_SERVICE_PAYMENT_URI:http://localhost:8083}
      notification: ${NEXORA_SERVICE_NOTIFICATION_URI:http://localhost:8084}
      ai: ${NEXORA_SERVICE_AI_URI:http://localhost:8085}
      food: ${NEXORA_SERVICE_FOOD_URI:http://localhost:8086}
      laundry: ${NEXORA_SERVICE_LAUNDRY_URI:http://localhost:8087}
      print: ${NEXORA_SERVICE_PRINT_URI:http://localhost:8088}
      medical: ${NEXORA_SERVICE_MEDICAL_URI:http://localhost:8089}
      chat: ${NEXORA_SERVICE_CHAT_URI:http://localhost:8090}
      lost-found: ${NEXORA_SERVICE_LOST_FOUND_URI:http://localhost:8091}

# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: 8080

# ── Actuator ──────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  # Only include components that are always expected to be present
  health:
    defaults:
      enabled: true

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO
    com.nexora.gateway: DEBUG
    reactor.netty: INFO
