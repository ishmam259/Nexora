version: 2.1

jobs:
  build-android-apk:
    docker:
      - image: cimg/android:2024.01-node
    working_directory: ~/project
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-deps-{{ checksum "frontend/package-lock.json" }}
      - run:
          name: Install dependencies
          command: cd frontend && npm ci
      - save_cache:
          key: npm-deps-{{ checksum "frontend/package-lock.json" }}
          paths:
            - frontend/node_modules
      - run:
          name: Install Ninja (required for CMake native builds)
          command: sudo apt-get update && sudo apt-get install -y ninja-build
      - run:
          name: Generate native Android project
          command: cd frontend && npx expo prebuild --platform android --no-install
      - restore_cache:
          keys:
            - gradle-caches-{{ checksum "frontend/android/build.gradle" }}
            - gradle-caches-
      - run:
          name: Build debug APK
          command: cd frontend/android && ./gradlew assembleDebug --no-daemon
      - save_cache:
          key: gradle-caches-{{ checksum "frontend/android/build.gradle" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - store_artifacts:
          path: frontend/android/app/build/outputs/apk/debug
          destination: apk

workflows:
  version: 2
  build:
    jobs:
      - build-android-apk:
          filters:
            branches:
              only:
                - main
