services:

  # ─────────────────────────────────────────────────────────────────────────────
  # Shared PostgreSQL for all microservices + Keycloak
  # ─────────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: nexora-postgres
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_password
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # Keycloak (Identity & Access Management)
  # ─────────────────────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: nexora
      KC_DB_PASSWORD: nexora_password
      KC_DB_POOL_INITIAL_SIZE: "3"
      KC_DB_POOL_MIN_SIZE: "3"
      KC_DB_POOL_MAX_SIZE: "10"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────────────
  # RabbitMQ (Message Broker)
  # ─────────────────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: nexora-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  pgdata:

